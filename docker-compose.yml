services:
  neo4j:
    image: neo4j:5-community
    container_name: drymem-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/drymem_pass
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - drymem_neo4j_data:/data
      - drymem_neo4j_logs:/logs

  postgres:
    image: postgres:17-alpine
    container_name: drymem-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: drymem
      POSTGRES_PASSWORD: drymem_pass
      POSTGRES_DB: drymem
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drymem"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - drymem_pg_data:/var/lib/postgresql/data

  # The memory engine. Never published: only the API talks to it.
  engine:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: drymem-engine
    restart: unless-stopped
    # Host networking so the server can reach Ollama, which listens on the
    # host's 127.0.0.1 only. The alternative is rebinding Ollama to 0.0.0.0,
    # which changes the developer's machine to suit our container. Step 4's
    # deployment has no Ollama on localhost and goes back to bridge networking.
    network_mode: host
    environment:
      DRYMEM_BIND: 127.0.0.1
      DRYMEM_PORT: 8090
      SERVICE_SECRET: ${SERVICE_SECRET:?set SERVICE_SECRET in .env}
      DATABASE_URL: postgresql+asyncpg://drymem:drymem_pass@localhost:5432/drymem
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: drymem_pass
      DRYMEM_EXTRACTOR: ${DRYMEM_EXTRACTOR:-ollama}
      # Ollama runs on the host, not in the compose network.
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://localhost:11434/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3.6:35b-a3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      SCRUB_DENYLIST: ${SCRUB_DENYLIST:-}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started

  # The control plane, and the web app. The only thing anyone talks to.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: drymem-api
    restart: unless-stopped
    # Host networking to match the engine, which needs it to reach Ollama.
    network_mode: host
    environment:
      BIND: 127.0.0.1
      PORT: 8080
      DATABASE_URL: postgres://drymem:drymem_pass@localhost:5432/drymem
      MEMORY_URL: http://127.0.0.1:8090
      SERVICE_SECRET: ${SERVICE_SECRET:?set SERVICE_SECRET in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-drymem <onboarding@resend.dev>}
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_healthy

volumes:
  drymem_neo4j_data:
  drymem_neo4j_logs:
  drymem_pg_data:
