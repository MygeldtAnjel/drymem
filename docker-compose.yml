services:
  # The two databases are in profiles so they can be left out entirely. A team
  # pointing at a managed Neo4j or Postgres should not also be running an unused
  # container beside it. `scripts/install.sh` sets COMPOSE_PROFILES; by hand,
  # `--profile bundled-neo4j --profile bundled-postgres` is the default pair.
  neo4j:
    profiles: ["bundled-neo4j"]
    image: neo4j:5-community
    container_name: ${COMPOSE_PROJECT_NAME:-drymem}-neo4j
    restart: unless-stopped
    # Bound to this machine, not to every interface: these are the two ports
    # that get a Neo4j owned when somebody publishes them by accident.
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"   # Browser UI
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"   # Bolt protocol
    environment:
      # Generated per install by scripts/install.sh. The fallback exists so a
      # clone still starts for someone poking at it; a published default is a
      # password every drymem on the internet shares.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-drymem_dev_only}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - drymem_neo4j_data:/data
      - drymem_neo4j_logs:/logs

  postgres:
    profiles: ["bundled-postgres"]
    image: postgres:17-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-drymem}-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: drymem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drymem_dev_only}
      POSTGRES_DB: drymem
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drymem"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - drymem_pg_data:/var/lib/postgresql/data

  # The memory engine. Never published: only the API talks to it.
  engine:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-drymem}-engine
    restart: unless-stopped
    # Host networking so the server can reach Ollama, which listens on the
    # host's 127.0.0.1 only. The alternative is rebinding Ollama to 0.0.0.0,
    # which changes the developer's machine to suit our container. Step 4's
    # deployment has no Ollama on localhost and goes back to bridge networking.
    network_mode: host
    environment:
      DRYMEM_BIND: 127.0.0.1
      DRYMEM_PORT: 8090
      SERVICE_SECRET: ${SERVICE_SECRET:?set SERVICE_SECRET in .env}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://drymem:${POSTGRES_PASSWORD:-drymem_dev_only}@localhost:${POSTGRES_PORT:-5432}/drymem}
      NEO4J_URI: ${NEO4J_URI:-bolt://localhost:${NEO4J_BOLT_PORT:-7687}}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-drymem_dev_only}
      DRYMEM_EXTRACTOR: ${DRYMEM_EXTRACTOR:-ollama}
      # Ollama runs on the host, not in the compose network.
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://localhost:11434/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3.6:35b-a3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      EMBEDDING_URL: ${EMBEDDING_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SCRUB_DENYLIST: ${SCRUB_DENYLIST:-}
    # `required: false` is what lets a bundled database be absent: with its
    # profile off the dependency is skipped rather than failing the stack.
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      neo4j:
        condition: service_started
        required: false

  # The control plane, and the web app. The only thing anyone talks to.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-drymem}-api
    restart: unless-stopped
    # Host networking to match the engine, which needs it to reach Ollama.
    network_mode: host
    environment:
      BIND: 127.0.0.1
      PORT: ${PORT:-8080}
      DATABASE_URL: ${API_DATABASE_URL:-postgres://drymem:${POSTGRES_PASSWORD:-drymem_dev_only}@localhost:${POSTGRES_PORT:-5432}/drymem}
      MEMORY_URL: http://127.0.0.1:8090
      SERVICE_SECRET: ${SERVICE_SECRET:?set SERVICE_SECRET in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # The marketing site's origin, when it is deployed apart from this server.
      # Its request-access form is the only cross-origin call in the product.
      LANDING_ORIGIN: ${LANDING_ORIGIN:-}
      ACCESS_REQUESTS_TO: ${ACCESS_REQUESTS_TO:-}
      EMAIL_FROM: ${EMAIL_FROM:-drymem <onboarding@resend.dev>}
      # Both empty means no GitHub button, which is the right default for a
      # laptop that cannot register an OAuth app.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      engine:
        condition: service_healthy

volumes:
  drymem_neo4j_data:
  drymem_neo4j_logs:
  drymem_pg_data:
