      THESIS: a team's memory is only worth having if anyone on the team can
      open it, read it, and run it. So this is an admin console, not a reading
      room: a rail of destinations, cards and tables, and every management
      action — members, roles, projects, skills, your own profile — reachable
      without touching a terminal.
      OWN-WORLD: a dark operator's room with one warm light in it. Cool
      near-black in four steps (#0b0d10 → #1e232b), amber (#f2a93b) as the only

      memory carries its own hue, always printed beside its own word, so the
      screen still reads in greyscale.
      STORY: someone lands on Overview, sees what the project knows and that the
      service is up, opens a memory, shares it with the team, adds a teammate,
      and publishes a skill — in that order, without leaving the browser.

      the project switcher in the header; four counters, the type mix, service
      health, and the latest memories.
      FORM: shadcn/ui (radix-nova) on Tailwind v4, Geist for text and JetBrains
      Mono for anything a machine named. Components are source in the repo, so
      the design system is editable rather than imported.

      screenshot pass at three widths, the contrast measured rather than
