[project]
name = "drymem"
version = "2.1.0"
description = "Persistent memory MCP server for AI coding assistants — backed by a Graphiti knowledge graph"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0",
    "argon2-cffi>=23.1.0",
    # Pinned exactly: Graphiti removes model fields between minor versions
    # (EntityEdge lost source_node_name and broke mem_search). Upgrades are a
    # deliberate change to memory_store.py, never a passive one.
    "graphiti-core==0.28.2",
    "neo4j>=5.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "anthropic>=0.40.0",
    "pyjwt>=2.12.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
drymem-server = "drymem_server.api.app:app"
drymem-admin = "drymem_server.admin:main"

[tool.hatch.build.targets.wheel]
packages = ["drymem_server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a running Neo4j (deselect with -m 'not integration')",
    "e2e: needs Neo4j and a real extraction model (deselect with -m 'not e2e')",
]

[tool.ruff]
line-length = 100
