    <!--
      THESIS: drymem's core question is a citator's question — is this authority
      still good? Every entry carries its standing, and every fact drawn from one
      carries its treatment. Refuses the sidebar-and-cards dark dashboard every
      memory tool ships.
      OWN-WORLD: law-library night. Cool near-black chrome (#171A1F), oxblood
      binding (#8C1D2C), sparing gilt (#C8A951), India paper reading column
      (#F1F0EA). Treatment marks carry state — open ring private, filled disc
      team, upright bar live, struck bar superseded — colour never alone.
      STORY: the reader asks "did we already decide this?", finds the entry,
      sees at a glance whether it still stands, and stamps it useful or shares it.
      FIRST VIEWPORT: two columns. Left, the volume index: drymem and the project
      in the head, five registers beneath it — entries, sittings, skills,
      projects, people — then citation lines carrying a standing mark, the
      title, its gloss and its provenance. Right, whatever the index points at,
      set on India paper at a 66ch measure: an entry's facts as a citation
      block and its body as labelled sections, with the margin rail carrying
      the actions. The registers live in the index head; the sidebar stays
      refused.
      FORM: legal citator (Shepard's/KeyCite), rank 1 of 7 grounded, seed 3b90d271.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, DESIGN.md, and every shipping raster carrying
      its provenance.
    -->
